<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <style>
    text{font-family:Arial,sans-serif;fill:#172033} .node{fill:#fff;stroke:#334155;stroke-width:1.4;rx:8} .actor{fill:#eef6ff}.proto{fill:#f8fbff}.ext{fill:#fff8e8}.group{fill:none;stroke:#94a3b8;stroke-dasharray:6 5}.edge{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrow)} .small{font-size:13px;fill:#475569}.label{font-size:12px;fill:#334155}.title{font-size:24px;font-weight:700}.name{font-size:16px;font-weight:700}
